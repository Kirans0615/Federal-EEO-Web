# Netlify build configuration for Federal EEO, LLC
#
# The site is built as a Next.js static export — no @netlify/plugin-nextjs
# runtime, no SSR. The build produces a fully static `out/` directory that
# Netlify serves directly. Form detection still works because the hidden
# schema forms in components/forms/NetlifyFormSchemas.tsx are rendered into
# every prerendered page.
#
# The GitHub Pages mirror is built separately via
# .github/workflows/deploy-pages.yml with GITHUB_PAGES=1 to flip on basePath.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_SITE_URL = "https://federal-eeo.netlify.app"

# Cache static assets aggressively, keep HTML fresh
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
