<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" fill="none">
  <!-- Concept 2: Scales of justice with flag-stripe accent -->
  <title>Federal EEO, LLC — Scales &amp; Flag Mark (Concept 2)</title>

  <!-- Flag-stripe gold bar -->
  <rect x="0" y="0" width="280" height="4" fill="#C4922A" rx="0"/>

  <!-- Scales beam -->
  <line x1="50" y1="25" x2="130" y2="25" stroke="#1B2A4A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center post -->
  <line x1="90" y1="18" x2="90" y2="70" stroke="#1B2A4A" stroke-width="2" stroke-linecap="round"/>
  <!-- Base -->
  <line x1="72" y1="70" x2="108" y2="70" stroke="#1B2A4A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left pan chain -->
  <line x1="52" y1="25" x2="38" y2="45" stroke="#1B2A4A" stroke-width="1.5"/>
  <line x1="60" y1="25" x2="62" y2="45" stroke="#1B2A4A" stroke-width="1.5"/>
  <!-- Left pan -->
  <path d="M34 45 Q50 53 66 45" stroke="#1B2A4A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Right pan chain -->
  <line x1="120" y1="25" x2="118" y2="45" stroke="#1B2A4A" stroke-width="1.5"/>
  <line x1="128" y1="25" x2="142" y2="45" stroke="#1B2A4A" stroke-width="1.5"/>
  <!-- Right pan -->
  <path d="M114 45 Q130 53 146 45" stroke="#1B2A4A" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Gold accent center pin -->
  <circle cx="90" cy="19" r="4" fill="#C4922A"/>

  <!-- Wordmark -->
  <text x="158" y="36" font-family="Georgia, serif" font-size="22" font-weight="600"
        fill="#1B2A4A" font-variant="small-caps">Federal EEO, LLC</text>
  <text x="159" y="54" font-family="Arial, sans-serif" font-size="9.5" fill="#6B7280"
        letter-spacing="2.5">CONSULTANTS &amp; ADVOCATES</text>

  <!-- Gold bottom rule under wordmark -->
  <line x1="158" y1="62" x2="275" y2="62" stroke="#C4922A" stroke-width="1.5"/>
</svg>
