<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" fill="none">
  <!-- Concept 3: Confident serif wordmark, gold underline on "EEO" -->
  <title>Federal EEO, LLC — Wordmark (Concept 3)</title>

  <!-- Three gold stars -->
  <g transform="translate(136,16)">
    <path d="M8 1.5l1.8 3.7 4.1.6-3 2.9.7 4.1L8 10.7l-3.6 1.9.7-4.1-3-2.9 4.1-.6z"
          fill="#C4922A"/>
    <path d="M24 1.5l1.8 3.7 4.1.6-3 2.9.7 4.1L24 10.7l-3.6 1.9.7-4.1-3-2.9 4.1-.6z"
          fill="#C4922A"/>
    <path d="M40 1.5l1.8 3.7 4.1.6-3 2.9.7 4.1L40 10.7l-3.6 1.9.7-4.1-3-2.9 4.1-.6z"
          fill="#C4922A"/>
  </g>

  <!-- "Federal" -->
  <text x="12" y="60" font-family="Georgia, serif" font-size="38" font-weight="600"
        fill="#1B2A4A" font-variant="small-caps">Federal</text>

  <!-- "EEO," — with gold underline to follow -->
  <text x="160" y="60" font-family="Georgia, serif" font-size="38" font-weight="600"
        fill="#1B2A4A" font-variant="small-caps"> EEO, LLC</text>

  <!-- Gold underline on "EEO" only -->
  <rect x="172" y="65" width="72" height="2.5" fill="#C4922A" rx="1"/>

  <!-- Subtitle -->
  <text x="12" y="80" font-family="Arial, sans-serif" font-size="9" fill="#6B7280"
        letter-spacing="3">CONSULTANTS &amp; ADVOCATES</text>
</svg>
